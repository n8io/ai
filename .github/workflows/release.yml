name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  version:
    name: Create Version PR
    runs-on: ubuntu-latest
    if: github.event.head_commit.author.name != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - name: Create Release Pull Request
        uses: changesets/action@v1
        with:
          version: bun run version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: Tag Plugin Releases
    runs-on: ubuntu-latest
    if: github.event.head_commit.author.name == 'github-actions[bot]' && contains(github.event.head_commit.message, 'Version Packages')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Tag plugins
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(jq -r .version package.json)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for plugin in workflow tools; do
            tag="${plugin}--v${version}"
            manifest="$(jq -r .version "plugins/${plugin}/.claude-plugin/plugin.json")"
            if [[ "$manifest" != "$version" ]]; then
              echo "::error::plugins/${plugin} manifest is ${manifest}, package.json is ${version}"
              exit 1
            fi
            if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
              echo "${tag} already exists"
              continue
            fi
            git tag -a "$tag" -m "${plugin} ${version}"
            git push origin "$tag"
          done
          gh release create "v${version}" --title "v${version}" --generate-notes \
            || echo "release v${version} already exists"
